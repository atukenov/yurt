# Local development stack.  Normally started through `./scripts/dev.sh`.
#   docker compose up -d postgres        -> database only (run the API from your IDE)
#   docker compose up -d --build         -> database + API on http://localhost:8080
#
# Everything below is a local-only default. Real secrets never live in this file; staging and
# production get theirs from the hosting provider's environment (see docs/runbook.md).
services:
  postgres:
    image: postgres:16-alpine
    container_name: yurt_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: YurtDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: dockerfile
    container_name: yurt_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DATABASE_URL: "Host=postgres;Port=5432;Database=YurtDb;Username=postgres;Password=postgres"
      Jwt__Secret: "local-dev-only-secret-change-me-0123456789"
      # Creates the first admin on an empty database; the app forces a password change at first login.
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_PASSWORD: admin12345
      # Platform operator (the /platform tools in the admin panel). Must be 12+ characters.
      SEED_SUPERADMIN_USERNAME: superadmin
      SEED_SUPERADMIN_PASSWORD: superadmin12345
      # Local: no real WhatsApp/SMS provider, so skip phone verification.
      Otp__Required: "false"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
