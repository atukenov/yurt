<div class="min-h-screen bg-stone-50 pb-8 flex flex-col">
  <div class="bg-surface border-b border-stone-100 px-4 py-4">
    <h1 class="text-xl font-bold text-stone-800">{{ 'group.joinTitle' | t }}</h1>
    <p class="text-xs text-stone-500 mt-0.5">{{ 'group.joinHint' | t }}</p>
  </div>

  <div class="flex-1 flex items-center justify-center p-6">
    <div class="w-full max-w-sm">
      <div class="bg-surface rounded-2xl border border-stone-100 shadow-sm p-6">
        <div class="text-center mb-6">
          <div class="text-5xl mb-3">👥</div>
          <p class="text-stone-500 text-sm">{{ 'group.askCode' | t }}</p>
        </div>

        <input
          type="text"
          [(ngModel)]="code"
          (ngModelChange)="code = code.toUpperCase()"
          placeholder="ABC123"
          maxlength="6"
          class="w-full text-center text-2xl font-bold tracking-widest px-4 py-4 rounded-2xl border-2 border-stone-200 focus:border-brand-400 focus:ring-2 focus:ring-brand-100 outline-none uppercase"
        />

        @if (error()) {
          <p class="text-red-500 text-xs text-center mt-2">{{ error() | t }}</p>
        }

        <button
          (click)="join()"
          [disabled]="loading() || code.trim().length !== 6"
          class="w-full mt-4 bg-brand-500 hover:bg-brand-600 active:scale-[0.98] disabled:opacity-60 text-on-brand font-bold rounded-2xl py-4 text-base shadow-lg transition-all"
        >
          {{ (loading() ? 'group.joining' : 'group.join') | t }}
        </button>
      </div>
    </div>
  </div>
</div>
