<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Yurt Admin</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Apply the saved theme before the first paint (ThemeService keeps it up to date afterwards).
      try {
        var t = localStorage.getItem('yurt.theme');
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
