<div
  class="min-h-screen bg-gradient-to-br from-night-800 to-night-900 flex items-center justify-center p-4"
>
  <div class="bg-surface rounded-3xl shadow-2xl w-full max-w-sm p-8">
    <!-- Logo -->
    <div class="text-center mb-8">
      <img [src]="brand.logo() ?? 'logo.png'" [alt]="brand.name()" [class.logo-for-dark]="brand.darkLogoShowing()" class="brand-logo w-16 h-16 object-contain mx-auto mb-3" />
      <h1 class="text-2xl font-bold text-stone-800">{{ brand.name() }} Admin</h1>
      <p class="text-slate-500 text-sm mt-1">Sign in to your account</p>
    </div>

    <form (ngSubmit)="login()" #form="ngForm">
      <div class="space-y-4">
        <div>
          <label for="admin-username" class="block text-sm font-medium text-slate-700 mb-1.5">Username</label>
          <input
            id="admin-username"
            type="text"
            name="username"
            [(ngModel)]="username"
            required
            autocomplete="username"
            class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-brand-400 focus:border-transparent outline-none transition-all"
            placeholder="e.g. admin"
          />
        </div>
        <div>
          <label for="admin-password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
          <input
            id="admin-password"
            type="password"
            name="password"
            [(ngModel)]="password"
            required
            autocomplete="current-password"
            class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-brand-400 focus:border-transparent outline-none transition-all"
            placeholder="••••••••"
          />
        </div>
      </div>

      @if (error()) {
        <p class="mt-3 text-tone-red text-xs text-center" role="alert">{{ error() }}</p>
      }

      <div class="mt-6">
        <yurt-button
          type="submit"
          variant="primary"
          size="lg"
          [fullWidth]="true"
          [loading]="loading()"
        >
          Sign In
        </yurt-button>
      </div>
    </form>
  </div>
</div>
