name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20.x'

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore
        working-directory: backend
        run: dotnet restore

      - name: Build
        working-directory: backend
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        working-directory: backend
        run: >
          dotnet test tests/Yurt.UnitTests/Yurt.UnitTests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=unit-results.trx"

      - name: Run integration tests
        working-directory: backend
        run: >
          dotnet test tests/Yurt.IntegrationTests/Yurt.IntegrationTests.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=integration-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/**/*.trx

      - name: Check for vulnerable packages (non-blocking)
        working-directory: backend
        run: dotnet list package --vulnerable --include-transitive 2>&1 || true

  # ── Migration guard ──────────────────────────────────────────────────────
  migrations:
    name: Migrations — additive only
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail on dropped or renamed schema objects
        run: ./scripts/check-migrations.sh "origin/${{ github.base_ref }}"

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Test native build scripts
        run: node --test scripts/*.test.mjs

      - name: Build customer app
        working-directory: frontend
        run: npx ng build yurt-customer --configuration production

      - name: Build admin app
        working-directory: frontend
        run: npx ng build yurt-admin --configuration production

      # Colour contrast and tap-target size on the customer screens (sign-in, menu, cart, order status, profile) and the main
      # admin screens (sign-in, orders, kitchen, cashier, menu, stock, customers), for every sample brand, light and dark.
      - name: Install accessibility check tools
        run: |
          mkdir -p "$RUNNER_TEMP/a11y" && cd "$RUNNER_TEMP/a11y"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.56.1 axe-core@4.14.0
          npx playwright install --with-deps chromium

      - name: Accessibility checks (light)
        working-directory: frontend
        env:
          NODE_PATH: ${{ runner.temp }}/a11y/node_modules
        run: node scripts/brand-screenshots.mjs "$RUNNER_TEMP/brand-screenshots" --a11y --fail

      - name: Accessibility checks (dark)
        working-directory: frontend
        env:
          NODE_PATH: ${{ runner.temp }}/a11y/node_modules
        run: node scripts/brand-screenshots.mjs "$RUNNER_TEMP/brand-screenshots" --a11y --dark --fail

      - name: Admin accessibility checks (light)
        working-directory: frontend
        env:
          NODE_PATH: ${{ runner.temp }}/a11y/node_modules
        run: node scripts/brand-screenshots.mjs "$RUNNER_TEMP/brand-screenshots" --app=admin --a11y --fail

      - name: Admin accessibility checks (dark)
        working-directory: frontend
        env:
          NODE_PATH: ${{ runner.temp }}/a11y/node_modules
        run: node scripts/brand-screenshots.mjs "$RUNNER_TEMP/brand-screenshots" --app=admin --a11y --dark --fail

      # Store screenshots for the sample cafe, so the store mode keeps working (not uploaded anywhere).
      - name: Store screenshots (sample cafe)
        working-directory: frontend
        env:
          NODE_PATH: ${{ runner.temp }}/a11y/node_modules
        run: node scripts/brand-screenshots.mjs "$RUNNER_TEMP/store-screenshots" --store=sample-cafe --lang=kk

      - name: Upload brand screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brand-screenshots
          path: ${{ runner.temp }}/brand-screenshots

      - name: Audit dependencies (non-blocking)
        working-directory: frontend
        run: npm audit --audit-level=high 2>&1 || true
